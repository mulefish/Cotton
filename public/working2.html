<html>

<head>
    <style>
        .mywidth {
            width: 220px;
        }

        #notesContainer {
            margin-top: 10px;
        }

        .layout {
            display: flex;
            gap: 20px;
            align-items: flex-start;

            text-align: center;
            padding: 4px;
            vertical-align: bottom;
        }

            padding: 8px 2px;
            white-space: nowrap;
        }
        .modal {
            position: fixed;
            inset: 0;
            background-color: rgba(0, 0, 0, 0.4);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .modal-content textarea {
            width: 100%;
            height: 300px;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .rotate-headers #selectionTable th.vertical-header {
            writing-mode: vertical-rl;
            transform: rotate(180deg);
        }
    </style>
</head>

<body>


    <div class="layout">

                <option value="ginTag">ginTag</option>
                <option value="hviColor">hviColor</option>
                <option value="hviPlusB">hviPlusB</option>
                <option value="hviRd">hviRd</option>
                <option value="issueDate">issueDate</option>
                <option value="leafGrade">leafGrade</option>
                <option value="loadingPaidFlag">loadingPaidFlag</option>
                <option value="micronaire">micronaire</option>
                <option value="netWeightLb">netWeightLb</option>
                <option value="receivingPaidFlag">receivingPaidFlag</option>
                <option value="remarks">remarks</option>
                <option value="stapleCode">stapleCode</option>
                <option value="storagePaidThrough">storagePaidThrough</option>
                <option value="strength">strength</option>

                <option value="tieCode">tieCode</option>
                <option value="trashPercent">trashPercent</option>
                <option value="uniformityIndex">uniformityIndex</option>
            </select>
            <p>Selected fields:</p>
            <button id="fetchBtn" type="button">Fetch Summary</button>
            <div id="errorMessage" style="color:red;"></div>
            <p>Limiter</p>
            <select onchange="rerender()" id="limit" class="mywidth">
                <option value="0" selected>0 or more</option>
                <option value="10">1 or more</option>
                <option value="100">10 or more</option>
                <option value="1000">1000 or more</option>
                <option value="10000">10000 or more</option>
            </select>
            <label style="display:block; margin-top:10px;">
                <input type="checkbox" id="rotateToggle">
                Rotate column headers 90°
            </label>
            <label style="display:block; margin-top:10px;">
                <input type="checkbox" id="highlightToggle" checked>
                Highlight changes between rows
            </label>
            <label style="display:block; margin-top:10px;">
                <input type="checkbox" id="notesToggle">
                Show notes
            </label>
            <button id="showModalBtn" type="button" style="margin-top:10px;">View data2json_typed snippet</button>

        </div>

        <table id="selectionTable" border="1" cellpadding="4" cellspacing="0">
            <thead>
                <tr id="selectionHeaderRow"></tr>
            </thead>
            <tbody></tbody>
        </table>

        <div id="notesContainer" style="display:none;">
            <textarea id="notes" rows="40" cols="50" placeholder="Add your notes here..."></textarea>
            <hr/>
            <button id="saveNotes1" onClick="saveNotes1()" type="button">Save 1</button>
            <button id="saveNotes2" onClick="saveNotes2()" type="button">Save 2</button>
            <button id="loadNotes1" onClick="loadNotes1()" type="button">Load 1</button>
            <button id="loadNotes2" onClick="loadNotes2()" type="button">Load 2</button>
        </div>

    </div>
